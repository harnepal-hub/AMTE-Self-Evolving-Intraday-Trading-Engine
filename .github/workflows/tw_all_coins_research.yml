name: TW All In One - All Coins Research

on:
  push:
    branches: [main]
    paths:
      - 'app/signals/tw_all_in_one_filtered.py'
      - 'app/backtest/**'
      - 'app/analytics/**'
      - 'scripts/run_tw_all_coins_research.py'
      - 'requirements.txt'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Cross-coin historical test
        run: python scripts/run_tw_all_coins_research.py --days 90 --workers 10 --out research_artifacts/tw_all_coins
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: tw-all-coins-research
          path: research_artifacts/tw_all_coins/
          retention-days: 30
