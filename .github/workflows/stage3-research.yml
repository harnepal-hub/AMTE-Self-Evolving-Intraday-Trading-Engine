name: AMTE Stage 3 Research

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt tabulate

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run CoinDCX historical research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_stage3_research.py --days 365

      - name: Upload Stage 3 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-stage3-research
          path: research_artifacts/stage3/
          retention-days: 30
