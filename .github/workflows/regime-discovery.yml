name: AMTE Regime Discovery

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/run_regime_discovery.py"
      - "requirements.txt"
      - ".github/workflows/regime-discovery.yml"
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt tabulate
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Run regime discovery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_regime_discovery.py --days 365
      - name: Upload discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-regime-discovery
          path: research_artifacts/regime_discovery/
          if-no-files-found: warn
