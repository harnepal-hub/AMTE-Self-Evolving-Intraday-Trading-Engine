name: AMTE 3-Strategy Paper Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_3strategy_paper.py'
      - 'docs/three-strategy-live.html'
      - 'docs/three-strategy-live.js'
      - '.github/workflows/paper_3strategy_5m.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amte-3strategy-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run independent 3-strategy paper engine
        run: python scripts/run_3strategy_paper.py --minutes 4.5 --max-pairs 30

      - name: Publish 3-strategy paper state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p /tmp/amte-3strategy-state data/paper_3strategy docs/live_3strategy
          cp -a data/paper_3strategy/. /tmp/amte-3strategy-state/
          rm -rf docs/live_3strategy
          mkdir -p docs/live_3strategy
          cp data/paper_3strategy/state.json docs/live_3strategy/state.json
          cp data/paper_3strategy/market.json docs/live_3strategy/market.json
          printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_3strategy/heartbeat.json
          git add data/paper_3strategy docs/live_3strategy
          git diff --cached --quiet || git commit -m "data: update 3-strategy paper state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/paper_3strategy docs/live_3strategy
            cp -a /tmp/amte-3strategy-state/. data/paper_3strategy/
            cp data/paper_3strategy/state.json docs/live_3strategy/state.json
            cp data/paper_3strategy/market.json docs/live_3strategy/market.json
            printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_3strategy/heartbeat.json
            git add data/paper_3strategy docs/live_3strategy
            git commit -m "data: update 3-strategy paper state" || true
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start next capture cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run paper_3strategy_5m.yml --repo "${GITHUB_REPOSITORY}" --ref main
