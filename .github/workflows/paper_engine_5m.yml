name: AMTE Server Paper Engine
# Runs every five minutes; each session monitors the live CoinDCX futures feed server-side.
# Dashboard heartbeat fix: publish fresh paper state on every scheduled/manual run.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_server_paper.py'
      - 'app/signals/tw_all_in_one_filtered.py'
      - '.github/workflows/paper_engine_5m.yml'

permissions:
  contents: write

concurrency:
  group: amte-server-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Run server-side paper engine
        run: python scripts/run_server_paper.py --minutes 4 --max-pairs 30

      - name: Publish live paper state safely
        if: always()
        run: |
          set -e
          mkdir -p /tmp/amte-paper-state
          cp -a data/paper_live/. /tmp/amte-paper-state/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another workflow may have pushed while this 4-minute session was running.
          # Rebase onto the current main before publishing the fresh paper state.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p data/paper_live
          cp -a /tmp/amte-paper-state/. data/paper_live/ 2>/dev/null || true

          git add data/paper_live
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "data: update server paper state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            cp -a /tmp/amte-paper-state/. data/paper_live/ 2>/dev/null || true
            git add data/paper_live
            git commit -m "data: update server paper state" || true
          done
          exit 1
