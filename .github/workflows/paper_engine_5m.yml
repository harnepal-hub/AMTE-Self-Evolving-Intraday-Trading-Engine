name: AMTE Server Paper Engine

on:
  # Watchdog: if the self-dispatch chain ever stops, a scheduled run restarts it.
  # The 17-minute offset avoids the top-of-hour Actions load spike.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_server_paper.py'
      - 'app/signals/tw_all_in_one_filtered.py'
      - 'app/execution/paper.py'
      - 'docs/app.js'
      - 'docs/live-hotfix.js'
      - '.github/workflows/paper_engine_5m.yml'
      - 'scripts/run_3strategy_paper.py'
      - 'docs/three-strategy-live.html'
      - 'docs/three-strategy-live.js'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: amte-server-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run should capture
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/paper_live/state.json ]; then
            last=$(python -c 'import json; from datetime import datetime; s=json.load(open("data/paper_live/state.json")); ts=s.get("updated_at"); print(int(datetime.fromisoformat(ts.replace("Z","+00:00")).timestamp()) if ts else 0)')
            now=$(date +%s)
            age=$((now-last))
            echo "paper-state age: ${age}s"
            if [ "$last" -gt 0 ] && [ "$age" -lt 420 ]; then
              SHOULD_RUN=false
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run server-side live paper engine
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/run_server_paper.py --minutes 4.5 --max-pairs 30

      - name: Run independent 3-strategy paper engine
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/run_3strategy_paper.py --minutes 3.5 --max-pairs 30

      - name: Publish live paper state
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/amte-paper-state
          cp -a data/paper_live/. /tmp/amte-paper-state/
          mkdir -p /tmp/amte-3strategy-state
          cp -a data/paper_3strategy/. /tmp/amte-3strategy-state/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data/paper_live data/paper_3strategy docs/live_data docs/live_3strategy
          cp -a /tmp/amte-paper-state/. data/paper_live/
          cp -a /tmp/amte-3strategy-state/. data/paper_3strategy/
          rm -rf docs/live_data
          mkdir -p docs/live_data
          cp data/paper_live/state.json docs/live_data/state.json
          cp data/paper_live/market.json docs/live_data/market.json
          printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_data/heartbeat.json

          cp data/paper_3strategy/state.json docs/live_3strategy/state.json
          cp data/paper_3strategy/market.json docs/live_3strategy/market.json
          printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_3strategy/heartbeat.json

          git add data/paper_live docs/live_data data/paper_3strategy docs/live_3strategy
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "data: update paper engine states"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            cp -a /tmp/amte-paper-state/. data/paper_live/
            mkdir -p data/paper_3strategy docs/live_data docs/live_3strategy
            cp -a /tmp/amte-3strategy-state/. data/paper_3strategy/
            cp data/paper_live/state.json docs/live_data/state.json
            cp data/paper_live/market.json docs/live_data/market.json
            printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_data/heartbeat.json
            cp data/paper_3strategy/state.json docs/live_3strategy/state.json
            cp data/paper_3strategy/market.json docs/live_3strategy/market.json
            printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_3strategy/heartbeat.json
            git add data/paper_live docs/live_data data/paper_3strategy docs/live_3strategy
            git commit -m "data: update paper engine states" || true
          done
          exit 1

      # Important: GITHUB_TOKEN-created pushes do not trigger a separate
      # workflow/Pages build. Deploy the freshly generated docs in this run.
      - name: Configure GitHub Pages
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy dashboard
        if: steps.guard.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start next capture cycle
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run paper_engine_5m.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Next paper cycle dispatched via workflow_dispatch."
