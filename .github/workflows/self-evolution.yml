name: AMTE Self-Evolution Research

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *"
  push:
    branches: [main]
    paths:
      - "app/research/evolution_engine.py"
      - "scripts/run_self_evolution.py"
      - "scripts/run_signal_ablation.py"
      - ".github/workflows/self-evolution.yml"
      - "app/signals/tw_all_in_one_filtered.py"
      - "app/backtest/**"
      - "app/analytics/**"

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt tabulate
      - name: Run tests
        run: python -m pytest -q
      - name: Run TW-only vs TW+AI signal ablation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_signal_ablation.py --days 180
      - name: Run AI-accepted TW filter confluence research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_ai_accepted_tw_filter_research.py
      - name: Upload AI-accepted TW filter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-ai-accepted-tw-filter
          path: research_artifacts/ai_accepted_tw_filter/
          retention-days: 30
      - name: Upload signal ablation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-signal-ablation
          path: research_artifacts/signal_ablation/
          retention-days: 30
      - name: Run self-evolution research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_self_evolution.py --days 180
      - name: Upload evolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-self-evolution
          path: research_artifacts/self_evolution/
          retention-days: 30
