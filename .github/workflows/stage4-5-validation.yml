name: AMTE Stage 4-5 Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt tabulate

      - name: Run Stage 4-5 validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_stage4_5_validation.py --days 365

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amte-stage4-5-validation
          path: research_artifacts/stage4_5/
          retention-days: 30
