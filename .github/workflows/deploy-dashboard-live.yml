name: Deploy AMTE Dashboard Live

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/paper_live/**'
      - '.github/workflows/deploy-dashboard-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare live data snapshot
        run: |
          rm -rf docs/live_data
          mkdir -p docs/live_data
          test -f data/paper_live/state.json
          test -f data/paper_live/market.json
          cp data/paper_live/state.json docs/live_data/state.json
          cp data/paper_live/market.json docs/live_data/market.json
          printf '{"generated_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/live_data/heartbeat.json
      - name: Verify dashboard entrypoint
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/live_data/state.json
          test -f docs/live_data/market.json
          grep -q "AI Scalping Agent" docs/index.html
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
